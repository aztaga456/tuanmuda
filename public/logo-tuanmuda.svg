<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="tmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>
  <!-- Emblem TM -->
  <rect x="2" y="6" width="48" height="48" rx="12" fill="url(#tmGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <text x="26" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">TM</text>
  
  <!-- Text Brand -->
  <text x="62" y="35" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">TUAN<tspan fill="url(#textGrad)">MUDA</tspan><tspan fill="#EC4899">.</tspan></text>
  <text x="63" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="800" fill="#94A3B8" letter-spacing="2.8">DIGITAL SOLUTION</text>
</svg>
